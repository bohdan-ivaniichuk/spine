server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the api upstream per request so a rebuilt/restarted api container (new IP) keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8080;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Container health check (no upstream dependency).
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # SPA health indicator: readiness of the API (includes the database check).
    location = /api/health {
        proxy_pass http://$api/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (path kept as-is). No URI part on purpose: with a variable in proxy_pass, a URI part
    # replaces the whole request URI (every call would hit "/api/"); without one the original
    # path and query string are passed through.
    location /api/ {
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output (outputHashing: all) can be cached forever.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the SPA entry point so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
