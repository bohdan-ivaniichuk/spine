<div
  class="flex flex-col items-center gap-1.5 text-center text-[10px] leading-tight text-ink-muted"
>
  <span
    class="inline-block size-2.5 rounded-full"
    [class.bg-ink-muted]="health.isLoading()"
    [class.bg-ok-fill]="!health.isLoading() && health.hasValue()"
    [class.bg-bad-fill]="unreachable()"
    aria-hidden="true"
  ></span>
  <span aria-live="polite">
    @if (health.isLoading()) {
      {{ i18n.t().app.apiChecking }}
    } @else if (health.hasValue()) {
      {{ i18n.t().app.apiOk }}
    } @else {
      {{ i18n.t().app.apiDown }}
    }
  </span>
  @if (unreachable()) {
    <button
      type="button"
      class="rounded-full bg-ink-2 px-2 py-0.5 text-on-ink hover:bg-ink-line focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-ink"
      (click)="health.reload()"
    >
      {{ i18n.t().app.retry }}
    </button>
  }
</div>
