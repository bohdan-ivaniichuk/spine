<div class="flex items-center gap-3 text-sm">
  <span
    class="inline-block size-2.5 rounded-full"
    [class.bg-accent]="health.isLoading()"
    [class.bg-ok]="!health.isLoading() && health.hasValue()"
    [class.bg-bad]="unreachable()"
    aria-hidden="true"
  ></span>
  <span aria-live="polite" class="text-muted">
    @if (health.isLoading()) {
      Checking API…
    } @else if (health.hasValue()) {
      API: OK
    } @else {
      API: unreachable
    }
  </span>
  @if (unreachable()) {
    <button
      type="button"
      class="rounded border border-line px-2 py-0.5 text-xs text-text hover:bg-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      (click)="health.reload()"
    >
      Retry
    </button>
  }
</div>
