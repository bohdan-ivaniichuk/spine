@if (feedback(); as fb) {
  @let t = i18n.t();
  <section
    class="flex flex-col gap-3 rounded-[24px] bg-ink p-6 text-on-ink"
    [attr.data-result]="fb.isCorrect ? 'correct' : 'incorrect'"
  >
    <div class="flex flex-wrap items-center gap-3">
      <p
        class="font-display text-[22px] font-extrabold tracking-[-0.03em]"
        [class]="fb.isCorrect ? 'text-on-ink' : 'text-warm'"
      >
        <span aria-hidden="true" class="mr-2">{{ fb.isCorrect ? '✓' : '✗' }}</span
        >{{ fb.isCorrect ? t.feedback.correct : t.feedback.incorrect }}
      </p>
      <span class="grow"></span>
      <span class="rounded-full bg-ink-2 px-3 py-1.5 font-mono text-xs text-ink-muted">{{
        t.feedback.nextIn(fb.intervalDays)
      }}</span>
    </div>
    <div
      class="text-[15px] leading-relaxed text-ink-muted [&_code]:bg-ink-2 [&_code]:text-on-ink"
      [attr.lang]="fb.language ?? null"
    >
      <app-prompt-markdown [source]="fb.explanation" />
    </div>
  </section>
}
