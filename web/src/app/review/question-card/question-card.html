@let q = question();
@let t = i18n.t();
<header class="flex flex-wrap items-center gap-2.5 text-[13px]">
  <span
    class="inline-flex h-7 min-w-7 items-center justify-center rounded-full px-2.5 font-semibold"
    [class]="'domain-' + domainPosition()"
    >{{ q.domain.title }}</span
  >
  <nav [attr.aria-label]="t.session.scopeNav" class="flex min-w-0 items-center gap-1.5 text-muted">
    <span class="truncate">{{ q.topic.title }}</span>
    <span aria-hidden="true">→</span>
    <span class="truncate font-medium text-text">{{ q.concept.title }}</span>
  </nav>
  <span class="ml-auto flex items-center gap-1.5 text-xs">
    <span
      class="inline-flex h-6 min-w-6 items-center justify-center rounded-full border border-line px-2 font-mono font-bold text-text"
      [attr.title]="levelName()"
      [attr.aria-label]="t.session.level(levelName())"
      >{{ q.level }}</span
    >
    @if (q.isNew) {
      <span class="rounded-full bg-accent-soft px-2.5 py-1 font-medium text-accent-text">{{
        t.session.isNew
      }}</span>
    }
    <app-en-badge [fallback]="q.fallback ?? false" />
    <app-unreviewed-badge [reviewed]="q.reviewed" />
  </span>
</header>
<div
  class="mt-5 text-[1.35rem] leading-[1.45] font-medium tracking-[-0.01em] text-text"
  [attr.lang]="q.language ?? null"
>
  <app-prompt-markdown [source]="q.prompt" />
</div>
