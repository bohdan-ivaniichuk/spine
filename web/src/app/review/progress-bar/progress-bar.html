<div class="flex items-center gap-4">
  @if (label() || weak()) {
    <span class="flex max-w-[60%] min-w-0 items-center gap-2">
      @if (label()) {
        <span
          class="inline-flex min-w-0 truncate rounded-full bg-surface px-3 py-1 text-xs font-medium text-muted shadow-card"
          >{{ label() }}</span
        >
      }
      @if (weak()) {
        <span
          data-testid="weak-chip"
          class="inline-flex shrink-0 rounded-full bg-bad-soft px-3 py-1 text-xs font-semibold text-bad"
          [attr.title]="i18n.t().session.weakHint"
          >{{ i18n.t().session.weak
          }}<span class="sr-only">: {{ i18n.t().session.weakHint }}</span></span
        >
      }
    </span>
  }
  <div
    class="h-2 flex-1 overflow-hidden rounded-full bg-surface"
    role="progressbar"
    [attr.aria-label]="i18n.t().session.progress"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="total()"
    [attr.aria-valuenow]="position()"
  >
    <div class="h-full rounded-full bg-accent transition-[width]" [style.width.%]="percent()"></div>
  </div>
  <span class="shrink-0 font-mono text-sm text-muted">{{ position() }} / {{ total() }}</span>
</div>
